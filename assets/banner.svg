<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Gradiente de Fundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Gradiente do Título -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Gradiente das Ondas -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filtro de Brilho / Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="radialGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 900; font-size: 54px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Fundo com Borda -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="20" fill="url(#radialGlow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Ondas Sonoras Decorativas de Fundo -->
  <g opacity="0.35" transform="translate(100, 160)">
    <path d="M 0 50 Q 125 -40 250 50 T 500 50 T 750 50 T 1000 50" fill="none" stroke="url(#waveGrad)" stroke-width="3"/>
    <path d="M 0 50 Q 125 120 250 50 T 500 50 T 750 50 T 1000 50" fill="none" stroke="url(#waveGrad)" stroke-width="2"/>
    <path d="M 0 50 Q 125 0 250 50 T 500 50 T 750 50 T 1000 50" fill="none" stroke="url(#waveGrad)" stroke-width="1.5"/>
  </g>

  <!-- Barras do Equalizador / Áudio (Glow) -->
  <g transform="translate(600, 120)" text-anchor="middle">
    <!-- Ícone Central de Microfone / Som -->
    <circle cx="0" cy="-40" r="38" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" filter="url(#glow)"/>
    <path d="M -8 -45 C -8 -50 8 -50 8 -45 L 8 -35 C 8 -30 -8 -30 -8 -35 Z" fill="#38bdf8"/>
    <path d="M -13 -36 C -13 -22 13 -22 13 -36 M 0 -22 L 0 -16 M -8 -16 L 8 -16" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Título Principal -->
  <text x="600" y="195" text-anchor="middle" class="title" filter="url(#glow)">FastWhisper Web Studio</text>

  <!-- Subtítulo -->
  <text x="600" y="235" text-anchor="middle" class="subtitle">
    Transcrição Ultra-Rápida de Áudio • YouTube • Arquivos • Microfone • Leitura de PDF em pt-BR
  </text>

  <!-- Chips / Pills de Destaque -->
  <g transform="translate(230, 275)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="65" y="21" text-anchor="middle" class="badge-text">⚡ 8x Faster</text>

    <!-- Pill 2 -->
    <rect x="145" y="0" width="145" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="217" y="21" text-anchor="middle" class="badge-text">🎙️ faster-whisper</text>

    <!-- Pill 3 -->
    <rect x="305" y="0" width="125" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="367" y="21" text-anchor="middle" class="badge-text">🌐 yt-dlp Audio</text>

    <!-- Pill 4 -->
    <rect x="445" y="0" width="135" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="512" y="21" text-anchor="middle" class="badge-text">📑 PDF to Speech</text>

    <!-- Pill 5 -->
    <rect x="595" y="0" width="145" height="34" rx="17" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <text x="667" y="21" text-anchor="middle" class="badge-text">📄 .docx / .md / .txt</text>
  </g>
</svg>
